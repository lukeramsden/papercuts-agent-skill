name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library tests (no cloud dependencies)
        run: make check
      - name: Install cloud SDKs and linter
        run: python -m pip install 'boto3>=1.40,<2' 'google-cloud-storage>=3,<4' ruff
      - name: Cloud SDK contract tests (no credentials or network calls)
        run: make test
      - name: Lint
        run: ruff check .
  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install 'boto3==1.40.0' 'google-cloud-storage==3.0.0'
      - run: make test
